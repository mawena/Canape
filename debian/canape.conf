# Canapé : réglages du service (format CLÉ=valeur, lu par systemd et par « canape --config »).
# Les lignes qui commencent par # sont ignorées ; décommentez une ligne pour la changer.
# Après une modification : sudo systemctl restart canape
#
# Le mot de passe commun et le secret des sessions sont créés à la première installation dans
# /etc/canape/secrets.conf (lu avant ce fichier). Pour les lire : pkexec cat /etc/canape/secrets.conf
# Une valeur écrite ici l'emporte sur secrets.conf.

# Adresse d'écoute. 127.0.0.1 si un proxy HTTPS (Caddy, nginx) tourne sur la même machine.
#CANAPE_HOTE=0.0.0.0

# Port d'écoute.
#CANAPE_PORT=8080

# Dossier des films (sous-dossiers permis). Sous-titres .srt ou .vtt à côté du film, même nom de base.
CANAPE_FILMS=/var/lib/canape/films

# Mot de passe commun. Vide = accès libre (déconseillé). Voir secrets.conf.
#CANAPE_MOT_DE_PASSE=

# Secret qui signe les cookies de session. Vide = aléatoire à chaque démarrage (les sessions tombent
# au redémarrage). Voir secrets.conf.
#CANAPE_SECRET=

# HTTPS servi directement par Canapé : chemins du certificat et de la clé (lisibles par l'utilisateur canape).
#CANAPE_TLS_CERT=
#CANAPE_TLS_CLE=

# 1 = faire confiance à X-Forwarded-Proto et X-Forwarded-For (un proxy HTTPS est devant Canapé).
#CANAPE_DERRIERE_PROXY=0

# Serveurs STUN/TURN donnés aux navigateurs, en JSON.
#CANAPE_ICE=[{"urls":"stun:stun.l.google.com:19302"}]

# Serveur TURN (coturn) pour les réseaux stricts : URL séparées par des virgules, et secret partagé
# (static-auth-secret de coturn) qui sert à fabriquer des identifiants temporaires.
#CANAPE_TURN_URLS=turn:exemple.fr:3478
#CANAPE_TURN_SECRET=

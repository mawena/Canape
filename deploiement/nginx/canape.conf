# Hôte virtuel nginx pour Canapé. Deux repères à remplacer :
#   canape.exemple.fr        -> le vrai domaine
#   CANAPE_PORT_A_REMPLACER  -> le port de Node (CANAPE_PORT de /etc/canape/canape.conf, 8080 par défaut)
# installer-serveur.sh le fait tout seul (et retire les lignes « listen [::]:… » si nginx n'écoute pas déjà en IPv6
# ailleurs). À la main : /etc/nginx/sites-available/<domaine>.conf (lien dans sites-enabled/), ou conf.d/.
# Les chemins Let's Encrypt ci-dessous sont ceux que certbot crée : voir « certbot --nginx » dans le README.

# Port 80 : certbot (défi ACME) et redirection vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name canape.exemple.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # « http2 » sur la ligne listen : fonctionne aussi avec nginx 1.24 (Ubuntu 24.04). Depuis nginx 1.25.1 la forme
    # « http2 on; » est préférée, l'ancienne ne fait qu'un avertissement.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name canape.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/canape.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canape.exemple.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:canape_ssl:5m;
    ssl_session_timeout 1d;

    # Les requêtes de Canapé sont minuscules (JSON) ; seuls les envois de films (plus bas) sont plus gros.
    client_max_body_size 1m;

    # En-têtes de sécurité : c'est Canapé lui-même qui les envoie (HSTS, Permissions-Policy avec caméra et micro
    # pour « self », CSP, nosniff, Referrer-Policy). Ne pas les doubler ici : un en-tête en double est ambigu.

    # L'application, l'API et les fichiers de l'interface.
    location / {
        proxy_pass http://127.0.0.1:CANAPE_PORT_A_REMPLACER;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;  # avec le port s'il y en a un : Canapé compare Origin et Host
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Envoi des films (protocole tus : morceaux de 64 Mo au plus, reprise possible). Le corps part tel quel vers
    # Node, sans copie sur le disque du serveur.
    location /api/televersement {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:CANAPE_PORT_A_REMPLACER;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;  # avec le port s'il y en a un : Canapé compare Origin et Host
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Les films (direct, version préparée, HLS) : gros fichiers, requêtes Range, aucune mise en mémoire tampon.
    location /media/ {
        proxy_pass http://127.0.0.1:CANAPE_PORT_A_REMPLACER;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;  # avec le port s'il y en a un : Canapé compare Origin et Host
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Séances : WebSocket (synchronisation, discussion, signalisation WebRTC). Connexion longue : un film dure des heures.
    location /ws/ {
        proxy_pass http://127.0.0.1:CANAPE_PORT_A_REMPLACER;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $http_host;  # avec le port s'il y en a un : Canapé compare Origin et Host
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;
        proxy_buffering off;
    }
}
